<!-- @dsCard group="6. Elevation" viewport="712x216" name="Elevation & glow" subtitle="Soft, warm-tinted shadows — never hard grey drops" -->
<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
<style>body{margin:0;padding:30px 24px;background:var(--paper);font-family:var(--font-sans);direction:rtl}
.row{display:flex;gap:26px;align-items:center}
.c{display:flex;flex-direction:column;align-items:center;gap:12px}
.b{width:92px;height:70px;background:var(--paper-raised);border-radius:var(--radius-lg)}
.l{font-family:var(--font-mono);font-size:11px;color:var(--ink-50);direction:ltr;unicode-bidi:isolate}
/* READABLE-TYPE STANDARD — a card is scanned at arm's length, not read.
   Body prose >=13px, labels >=11px. Derivations live in readme.md, not here. */
.l{font-size:12px}
</style></head>
<body><div class="row">
<div class="c"><span class="b" style="box-shadow:var(--shadow-sm)"></span><span class="l">sm</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-md)"></span><span class="l">md</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-lg)"></span><span class="l">lg</span></div>
<div class="c"><span class="b" style="box-shadow:var(--shadow-xl)"></span><span class="l">xl</span></div>
<div class="c"><span class="b" style="box-shadow:var(--glow-warm)"></span><span class="l">glow-warm</span></div>
<div class="c"><span class="b" style="box-shadow:var(--glow-cool)"></span><span class="l">glow-cool</span></div>
</div><p class="readmore" dir="ltr">Shadow tinting and the two reserved glows → readme.md §Elevation.</p>
</body></html>
