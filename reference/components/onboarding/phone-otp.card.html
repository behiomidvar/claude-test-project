<!-- @dsCard group="Onboarding" viewport="440x600" name="Phone & OTP" subtitle="Phone with a fixed +98 affix (the one LTR, Latin-digit field); OTP with filled, error, and resend-timer states." -->
<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--paper);direction:rtl}
.wrap{max-width:392px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.cap{direction:ltr;text-align:left;unicode-bidi:isolate;font-size:var(--text-micro);font-weight:var(--fw-bold);color:var(--text-subtle);margin-bottom:10px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { PhoneInput, OtpInput } = window.DeltalkDesignSystem_288455;
function Demo(){
  const [ph,setPh]=React.useState('9123456789');
  const [otp,setOtp]=React.useState('4207');
  return <div className="wrap">
    <div><div className="cap">PHONE — FIXED +98 AFFIX (LTR)</div>
      <PhoneInput value={ph} onChange={setPh} hint="کد تأیید برایت پیامک می‌شود"/></div>
    <div><div className="cap">OTP — FILLED + RESEND TIMER</div>
      <OtpInput value={otp} onChange={setOtp} resendSeconds={38} autoFocus={false}/></div>
    <div><div className="cap">OTP — ERROR</div>
      <OtpInput value="429318" error="کد واردشده درست نیست" autoFocus={false}/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script><script src="../../theme-toggle.js"></script></body></html>
