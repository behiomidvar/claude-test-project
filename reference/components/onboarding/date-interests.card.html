<!-- @dsCard group="Onboarding" viewport="760x520" name="Date of birth & interests" subtitle="DateOfBirthFieldGroup (typed Jalali entry — supersedes the retired ShamsiDatePicker calendar) and capped multi-select interest chips." -->
<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--paper);direction:rtl}
.grid{display:grid;grid-template-columns:minmax(300px,340px) 1fr;gap:28px;align-items:start;max-width:760px;margin:0 auto}
.cap{direction:ltr;text-align:left;unicode-bidi:isolate;font-size:var(--text-micro);font-weight:var(--fw-bold);color:var(--text-subtle);margin-bottom:12px}
.sel{margin-top:14px;font-size:var(--text-body-sm);color:var(--text-muted);direction:ltr;text-align:left;unicode-bidi:isolate}
.sel b{color:var(--action-primary)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { DateOfBirthFieldGroup, InterestPicker } = window.DeltalkDesignSystem_288455;
const INTERESTS=[
 {value:'books',label:'کتاب'},{value:'cinema',label:'سینمای مستقل'},{value:'coffee',label:'قهوهٔ دستی'},
 {value:'hike',label:'کوه و طبیعت'},{value:'music',label:'موسیقی زنده'},{value:'cook',label:'آشپزی'},
 {value:'travel',label:'سفر بی‌برنامه'},{value:'art',label:'هنر و نمایشگاه'},{value:'night',label:'گفت‌وگوی شبانه'}];
function Demo(){
  const [dob,setDob]=React.useState({day:'12',month:2,year:'1363'});
  const [sel,setSel]=React.useState(['books','coffee']);
  return <div className="grid">
    <div><div className="cap">DATE OF BIRTH — TYPED JALALI ENTRY</div>
      <DateOfBirthFieldGroup day={dob.day} month={dob.month} year={dob.year}
        onChange={(v)=>setDob({...dob,...v})}
        hint="فقط سنت روی پروفایل دیده می‌شود، نه تاریخ تولدت"/>
      <div className="sel">Supersedes <b>ShamsiDatePicker</b> — the calendar was retired.</div>
    </div>
    <div><div className="cap">INTERESTS — MULTI-SELECT (MAX ۵)</div>
      <InterestPicker options={INTERESTS} value={sel} onChange={setSel} max={5}/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script><script src="../../theme-toggle.js"></script></body></html>
