<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--paper);direction:rtl}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.chat{display:flex;flex-direction:column}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { MessageBubble, VoiceNote, PromptCard, TypingDots } = window.DeltalkDesignSystem_288455;
function Demo(){
  const [p,setP]=React.useState(false);
  return <div className="wrap">
    <div className="chat">
      <MessageBubble from="them">جواب پرسشت خنده‌م انداخت — مخصوصاً اون تیکهٔ مادربزرگ.</MessageBubble>
      <MessageBubble from="me" time="۹:۴۱">راستش اون دربارهٔ همه‌چیز حق داشت.</MessageBubble>
      <div style={{display:'flex',justifyContent:'flex-start',marginBottom:8}}><VoiceNote from="them" duration="۰:۱۴" playing={p} onToggle={()=>setP(v=>!v)} /></div>
      <MessageBubble from="them" typing />
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <PromptCard question="دربارهٔ چه چیزی می‌تونی ساعت‌ها حرف بزنی؟"
        answer="فیلم‌هایی که هیچ‌کس ندیده، و اینکه چرا مادربزرگم دربارهٔ همه‌چیز حق داشت." />
      <div style={{display:'flex',gap:20,alignItems:'center',padding:'4px 2px'}}>
        <TypingDots color="var(--cool-violet)" />
        <TypingDots size="lg" brand />
      </div>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script><script src="../../theme-toggle.js"></script></body></html>
