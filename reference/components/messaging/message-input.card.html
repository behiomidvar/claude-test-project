<!-- @dsCard group="Messaging" viewport="440x540" name="MessageInput — composer states" subtitle="Empty (emoji · attach · voice), typing (send), recording (waveform + timer), and disabled/blocked." -->
<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--paper);direction:rtl}
.wrap{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.cap{direction:ltr;text-align:left;unicode-bidi:isolate;font-size:var(--text-micro);font-weight:var(--fw-bold);color:var(--text-subtle)}
.box{border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--border-subtle)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { MessageInput } = window.DeltalkDesignSystem_288455;
function Demo(){
  const [v,setV]=React.useState('امشب وقت داری یه قهوه بخوریم');
  return <div className="wrap">
    <div><div className="cap">EMPTY</div><div className="box"><MessageInput state="empty"/></div></div>
    <div><div className="cap">TYPING</div><div className="box"><MessageInput state="typing" value={v} onChange={e=>setV(e.target.value)}/></div></div>
    <div><div className="cap">RECORDING</div><div className="box"><MessageInput state="recording" recordTime="۰:۰۸"/></div></div>
    <div><div className="cap">DISABLED — UNMATCHED / BLOCKED</div><div className="box"><MessageInput state="disabled"/></div></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script><script src="../../theme-toggle.js"></script></body></html>
