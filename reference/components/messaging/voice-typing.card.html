<!-- @dsCard group="Messaging" viewport="480x540" name="Voice, typing & separators" subtitle="Voice player (waveform + duration), the three-dot typing indicator, date separator and system messages." -->
<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:24px;background:var(--paper);direction:rtl}
.thread{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.rec{display:flex;justify-content:flex-end}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { VoicePlayer, TypingIndicator, DateSeparator, SystemMessage } = window.DeltalkDesignSystem_288455;
function Demo(){
  const [p,setP]=React.useState(true);
  return <div className="thread">
    <DateSeparator label="امروز"/>
    <SystemMessage variant="match">شما در ۱۲ خرداد مچ شدید</SystemMessage>
    <div className="rec"><VoicePlayer from="sent" playing={p} progress={0.45} duration="۰:۱۴" onToggle={()=>setP(v=>!v)}/></div>
    <VoicePlayer from="received" duration="۰:۲۲"/>
    <TypingIndicator label="سارا در حال نوشتن است"/>
    <SystemMessage variant="info">پیام‌های این گفت‌وگو فقط برای شما دو نفر دیده می‌شود.</SystemMessage>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script><script src="../../theme-toggle.js"></script></body></html>
