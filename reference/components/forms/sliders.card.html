<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;padding:28px;background:var(--paper);direction:rtl}
.wrap{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:30px}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { RangeSlider } = window.DeltalkDesignSystem_288455;
function Demo(){
  const [age,setAge]=React.useState([27,41]);
  const [dist,setDist]=React.useState(15);
  return <div className="wrap">
    <RangeSlider dual label="بازهٔ سنی" min={18} max={70} values={age} onChange={setAge} unit="سال"/>
    <RangeSlider label="حداکثر فاصله" min={1} max={100} value={dist} onChange={setDist} unit="کیلومتر"/>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script><script src="../../theme-toggle.js"></script></body></html>
